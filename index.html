<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" id="meta-theme-color" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved ? saved : (prefersDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('meta-theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#090d16' : '#ffffff');
          }
        } catch (e) {}
      })();
    </script>
    <title>Abhinav Sharma — CSE Portfolio</title>
    <meta name="description" content="Personal developer portfolio of Abhinav Sharma — B.Tech CSE student at KCC ITM. Showcasing projects in C, Python, Java, and Web Development." />
    <meta name="keywords" content="Abhinav Sharma, developer, portfolio, CSE, B.Tech, KCC ITM, C, Python, Java, React" />
    <meta name="author" content="Abhinav Sharma" />

  </head>
